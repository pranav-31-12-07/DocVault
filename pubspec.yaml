name: doc
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  image_picker: ^1.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  saver_gallery: ^5.1.0
  pdf: ^3.11.0
  printing: ^5.13.0
  flutter_file_dialog: ^3.0.2
  permission_handler: ^12.0.1
  flutter_launcher_icons: ^0.14.4

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"
  min_sdk_android: 21